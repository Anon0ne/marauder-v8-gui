name: Windows regression tests and standalone build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - run: python -m pip install -r requirements-build.lock
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Build and install using the Windows source installer
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'Specter Windows QA\Source Install'
          ./Build-And-Install-Windows.ps1 -PythonExe (Get-Command python).Source -InstallDirectory (Join-Path $root 'App') -DesktopDirectory (Join-Path $root 'Desktop') -StartMenuDirectory (Join-Path $root 'Start Menu')
      - name: Verify source and portable installs and packaged GUI
        shell: pwsh
        run: ./tools/Test-WindowsInstall.ps1 -TestRoot (Join-Path $env:RUNNER_TEMP 'Specter Windows QA')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MarauderV8-Windows-beta
          path: dist/Windows-Test/
          if-no-files-found: error
