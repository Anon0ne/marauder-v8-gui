name: Windows regression tests and standalone build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - run: python -m pip install -r requirements-build.lock
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean MarauderV8-Control.spec
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MarauderV8-Windows-beta
          path: dist/MarauderV8-Control.exe
