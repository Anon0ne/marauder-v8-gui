name: Bug report
description: Report a reproducible application problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Report security vulnerabilities privately using SECURITY.md. Remove credentials and identifying network data from all examples."
  - type: input
    id: version
    attributes:
      label: Application version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and installation method
      description: "Include OS version, source or EXE, and Python version if applicable."
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Board and firmware version
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: "Use a minimal example with fabricated identifiers."
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error output or screenshots
      description: "For AI/NPU errors, include engine, model, runtime, driver, and execution device."
