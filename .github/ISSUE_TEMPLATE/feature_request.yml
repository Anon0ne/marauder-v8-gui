name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Feature requests are welcome — tell me what would make this more useful.
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the feature and what problem it solves for you.
      placeholder: A picker that auto-refreshes when a scan stops, so I don't have to hit Refresh.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Related commands, firmware specifics, mockups, or examples.
