name: Feature request
description: Suggest an improvement
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: "Describe the user need and the hardware/OS affected."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: "Explain the expected workflow and any alternatives."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Firmware support, privacy, and safety considerations
      description: "Link command documentation if available. Explain whether the feature transmits, changes firmware, or stores private data."
